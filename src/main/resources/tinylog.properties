# Tinylog 配置（可用于通过配置文件调整日志行为）。
# 程序化配置（VPCLI#configureLogging）按 -Dvpcli.log.profile 读取对应分组并 apply：
#   - 未指定 profile（默认 dev）  -> 读取 dev.* 分组，输出到控制台
#   - 指定 -Dvpcli.log.profile=prod -> 读取 prod.* 分组，写到滚动文件
# 公共项（writer.level / writer.format）对 dev 与 prod 同时生效。
# 采用 Tinylog 默认流划分：warn/error -> System.err，其余 -> System.out（不固定 stream）。

# 公共：日志级别与行格式（对齐原 logback pattern：%d{HH:mm:ss.SSS} %-5level %logger{0} - %msg%n）
writer.level = trace
writer.format = {date:HH:mm:ss.SSS} {level:min-size=5} {class-name} - {message}

# ---- dev：控制台输出 ----
dev.writer = console

# ---- prod：滚动文件输出 ----
# writer.file 由代码拼接：<插件日志目录> + 该文件名模式（pattern 需含 placeholders）
prod.writer = rolling file
prod.writer.file.pattern = vpcli.{date:yyyy-MM-dd}.{count}.log
# 到达 5MB 或跨天时轮换，保留最近 30 份（该文件数为上限，无总大小上限参数）
prod.writer.policies = size: 5mb, daily
prod.writer.backups = 30
