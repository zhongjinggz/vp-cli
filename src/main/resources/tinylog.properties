# writer.file 在插件加载（VPCLI#loaded）时按插件安装目录下 log/ 覆盖；
# 下面 writer.file 是插件目录不可得时的兜底（写到系统临时目录）。不带 writer.latest。
writer = rolling file
writer.level = trace
writer.format = {date:HH:mm:ss.SSS} {level:min-size=5} {class-name} - {message}
writer.file.pattern = vpcli.{date:yyyy-MM-dd}.{count}.log
writer.file = #{java.io.tmpdir}/vpcli.{date:yyyy-MM-dd}.{count}.log
writer.policies = size: 5mb, daily
writer.backups = 30
